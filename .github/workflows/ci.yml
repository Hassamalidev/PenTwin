name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Known vulnerabilities in what ships to users: fail on high or critical.
      - run: pnpm audit --prod --audit-level high

  # The whole local flow in a real browser: sample photo, glyph bank, upload, preview, export.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7

  # Migrations, row-level security and the credit ledger against a real Postgres.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pentwin_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pentwin_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  # The worker's container image builds, starts and answers its health check.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pentwin-worker .
      - name: Start the container and wait for it to report healthy
        run: |
          docker run -d --name worker --memory=512m -p 8787:8787 pentwin-worker
          for i in $(seq 1 30); do
            [ "$(docker inspect worker --format '{{.State.Health.Status}}')" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs worker
          exit 1
      - name: It refuses to start in production without its settings
        run: |
          ! docker run --rm -e APP_ENV=production pentwin-worker
